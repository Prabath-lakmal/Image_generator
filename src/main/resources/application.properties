spring.application.name=Image_generator

server.port=8081

# --- Spring AI: Google GenAI Image (Gemini Developer API mode) ---
# IMPORTANT (verified against the 2.0.1 auto-configuration bytecode):
#  - Connection settings (api-key, project-id, location) bind to: spring.ai.google.genai.*
#  - Runtime model options (model, n, aspect-ratio, ...) bind to: spring.ai.google.genai.image.*
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Supported models per Spring AI docs: gemini-2.5-flash-image, gemini-3-pro-image, gemini-3.1-flash-image
spring.ai.google.genai.image.model=gemini-2.5-flash-image
